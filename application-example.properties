# Konfigurationsbeispiel (ohne geheime Zugangsdaten)
# Kopieren nach src/main/resources/application-local.properties und mit
#   ./gradlew bootRun --args='--spring.profiles.active=local'
# starten. Schluessel bevorzugt als Umgebungsvariablen setzen:
#   FLOODMONITOR_ADMIN_KEY=<geheimer-admin-schluessel>
#   FLOODMONITOR_READER_KEY=<geheimer-lese-schluessel>

server.port=8080

simulation.enabled=true
simulation.interval=10000
simulation.backfill-hours=6
simulation.backfill-step-minutes=5
simulation.seed=

warning.max-measurement-age-seconds=120

api.max-limit=1000
api.default-limit=100
api.max-range-days=31
api.max-history-per-station=20000

security.api-key.admin=${FLOODMONITOR_ADMIN_KEY}
security.api-key.reader=${FLOODMONITOR_READER_KEY}
