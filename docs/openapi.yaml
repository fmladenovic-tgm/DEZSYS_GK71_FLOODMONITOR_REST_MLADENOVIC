openapi: 3.0.1
info:
  title: Flood Monitor REST API
  description: "Hochwasser-Messstationen. Format ueber Accept-Header: application/json\
    \ (Standard) oder application/xml, sonst 406. GET ist offen, POST/DELETE brauchen\
    \ den Header X-API-Key (fehlt/falsch -> 401, Lese-Key -> 403). Fehler kommen immer\
    \ als ErrorResponse."
  version: "1.0"
servers:
- url: http://localhost:8081
  description: Generated server url
paths:
  /api/v1/stations:
    get:
      tags:
      - station-controller
      summary: "Alle Stationen, optional gefiltert nach river, isActive, warningLevel"
      operationId: getStations
      parameters:
      - name: river
        in: query
        required: false
        schema:
          type: string
      - name: isActive
        in: query
        required: false
        schema:
          type: boolean
      - name: warningLevel
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/StationList"
            application/json:
              schema:
                $ref: "#/components/schemas/StationList"
        "406":
          description: Format nicht unterstuetzt
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/StationList"
            application/json:
              schema:
                $ref: "#/components/schemas/StationList"
        "400":
          description: ungueltiger Filter
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/StationList"
            application/json:
              schema:
                $ref: "#/components/schemas/StationList"
    post:
      tags:
      - station-controller
      summary: Station anlegen (braucht X-API-Key)
      operationId: createStation
      requestBody:
        content:
          application/xml:
            schema:
              $ref: "#/components/schemas/Station"
          application/json:
            schema:
              $ref: "#/components/schemas/Station"
        required: true
      responses:
        "201":
          description: angelegt
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Station"
            application/json:
              schema:
                $ref: "#/components/schemas/Station"
        "400":
          description: ungueltige Daten
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Station"
            application/json:
              schema:
                $ref: "#/components/schemas/Station"
        "409":
          description: ID gibt es schon
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Station"
            application/json:
              schema:
                $ref: "#/components/schemas/Station"
        "415":
          description: Content-Type nicht unterstuetzt
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Station"
            application/json:
              schema:
                $ref: "#/components/schemas/Station"
        "401":
          description: API-Key fehlt oder falsch
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Station"
            application/json:
              schema:
                $ref: "#/components/schemas/Station"
        "403":
          description: API-Key darf nur lesen
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Station"
            application/json:
              schema:
                $ref: "#/components/schemas/Station"
      security:
      - apiKey: []
  /api/v1/stations/{stationId}:
    get:
      tags:
      - station-controller
      summary: Eine Station
      operationId: getStation
      parameters:
      - name: stationId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Station"
            application/json:
              schema:
                $ref: "#/components/schemas/Station"
        "404":
          description: Station nicht gefunden
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Station"
            application/json:
              schema:
                $ref: "#/components/schemas/Station"
    delete:
      tags:
      - station-controller
      summary: Station loeschen (braucht X-API-Key)
      operationId: deleteStation
      parameters:
      - name: stationId
        in: path
        required: true
        schema:
          type: string
      responses:
        "404":
          description: Station nicht gefunden
        "204":
          description: geloescht
        "401":
          description: API-Key fehlt oder falsch
        "403":
          description: API-Key darf nur lesen
      security:
      - apiKey: []
  /api/v1/stations/{stationId}/statistics:
    get:
      tags:
      - measurement-controller
      summary: "Statistik (ohne from/to: letzte 24 Stunden)"
      operationId: getStatistics
      parameters:
      - name: stationId
        in: path
        required: true
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Statistics"
            application/json:
              schema:
                $ref: "#/components/schemas/Statistics"
        "404":
          description: Station nicht gefunden
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Statistics"
            application/json:
              schema:
                $ref: "#/components/schemas/Statistics"
        "400":
          description: ungueltiger Zeitraum
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Statistics"
            application/json:
              schema:
                $ref: "#/components/schemas/Statistics"
  /api/v1/stations/{stationId}/measurements:
    get:
      tags:
      - measurement-controller
      summary: "Historische Messwerte (neueste zuerst). from/to im ISO-8601 Format,\
        \ limit 1-1000 (Standard 100)"
      operationId: getHistory
      parameters:
      - name: stationId
        in: path
        required: true
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: warningLevel
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/MeasurementList"
            application/json:
              schema:
                $ref: "#/components/schemas/MeasurementList"
        "404":
          description: Station nicht gefunden
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/MeasurementList"
            application/json:
              schema:
                $ref: "#/components/schemas/MeasurementList"
        "400":
          description: "ungueltiges Datum, from nach to, falsches limit oder falsche\
            \ Warnstufe"
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/MeasurementList"
            application/json:
              schema:
                $ref: "#/components/schemas/MeasurementList"
  /api/v1/stations/{stationId}/measurements/latest:
    get:
      tags:
      - measurement-controller
      summary: Aktuellster Messwert
      operationId: getLatest
      parameters:
      - name: stationId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Measurement"
            application/json:
              schema:
                $ref: "#/components/schemas/Measurement"
        "404":
          description: Station unbekannt oder keine Messwerte
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Measurement"
            application/json:
              schema:
                $ref: "#/components/schemas/Measurement"
  /api/v1/alerts:
    get:
      tags:
      - alert-controller
      summary: "Aktuelle Warnungen, Filter warningLevel (WARNING/CRITICAL) und river"
      operationId: getAlerts
      parameters:
      - name: warningLevel
        in: query
        required: false
        schema:
          type: string
      - name: river
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/AlertList"
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"
        "400":
          description: ungueltige Warnstufe
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/AlertList"
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"
components:
  schemas:
    Location:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    Station:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        river:
          type: string
        location:
          $ref: "#/components/schemas/Location"
        normalWaterLevel:
          type: number
          format: double
        warningWaterLevel:
          type: number
          format: double
        criticalWaterLevel:
          type: number
          format: double
        isActive:
          type: boolean
        status:
          type: string
          enum:
          - ONLINE
          - MAINTENANCE
          - OFFLINE
        currentWarningLevel:
          type: string
          readOnly: true
          enum:
          - NORMAL
          - WARNING
          - CRITICAL
          - UNKNOWN
    StationList:
      type: object
      properties:
        count:
          type: integer
          format: int32
        stations:
          type: array
          items:
            $ref: "#/components/schemas/Station"
    Statistics:
      type: object
      properties:
        stationId:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        measurementCount:
          type: integer
          format: int32
        minWaterLevel:
          type: number
          format: double
        maxWaterLevel:
          type: number
          format: double
        averageWaterLevel:
          type: number
          format: double
        averageFlowRate:
          type: number
          format: double
        totalRainfall:
          type: number
          format: double
        warningCount:
          type: integer
          format: int32
        criticalCount:
          type: integer
          format: int32
    Measurement:
      type: object
      properties:
        stationId:
          type: string
        timestamp:
          type: string
          format: date-time
        waterLevel:
          type: number
          format: double
        flowRate:
          type: number
          format: double
        rainfall:
          type: number
          format: double
        temperature:
          type: number
          format: double
        batteryLevel:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - ONLINE
          - MAINTENANCE
          - OFFLINE
        warningLevel:
          type: string
          enum:
          - NORMAL
          - WARNING
          - CRITICAL
          - UNKNOWN
    MeasurementList:
      type: object
      properties:
        stationId:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        count:
          type: integer
          format: int32
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/Measurement"
    Alert:
      type: object
      properties:
        stationId:
          type: string
        stationName:
          type: string
        river:
          type: string
        timestamp:
          type: string
          format: date-time
        warningLevel:
          type: string
          enum:
          - NORMAL
          - WARNING
          - CRITICAL
          - UNKNOWN
        waterLevel:
          type: number
          format: double
        thresholdWaterLevel:
          type: number
          format: double
        message:
          type: string
    AlertList:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        count:
          type: integer
          format: int32
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-API-Key
      in: header
