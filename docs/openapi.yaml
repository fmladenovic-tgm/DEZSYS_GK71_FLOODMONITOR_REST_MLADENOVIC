openapi: 3.0.1
info:
  title: Flood Monitor REST API
  description: |
    REST-Schnittstelle eines Hochwasser-Fruehwarnsystems.

    **Formate:** Alle Ressourcen sind als JSON (Standard) und XML verfuegbar.
    Das Format wird ueber den `Accept`-Header gewaehlt (`application/json` oder `application/xml`).
    Ohne Accept-Header wird JSON geliefert, nicht unterstuetzte Formate liefern **406 Not Acceptable**.

    **Authentifizierung:** Lesende Zugriffe (GET) sind oeffentlich. Schreibende Zugriffe
    (POST, PATCH, DELETE) benoetigen den Header `X-API-Key`. Fehlender/ungueltiger Schluessel -> 401,
    Lese-Schluessel ohne Schreibrecht -> 403.

    **Fehler:** Alle Fehler werden einheitlich als `ErrorResponse` (JSON oder XML) geliefert.
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Lokale Entwicklung
tags:
- name: Stationen
  description: Messstationen abrufen und verwalten
- name: Warnungen
  description: Aktuelle Hochwasserwarnungen
- name: Messwerte
  description: "Aktuelle und historische Messwerte, Statistik"
paths:
  /api/v1/stations:
    get:
      tags:
      - Stationen
      summary: Alle Messstationen abrufen
      description: "Optional gefiltert nach Fluss, Aktiv-Status und aktueller Warnstufe\
        \ (UND-verknuepft)."
      operationId: getStations
      parameters:
      - name: river
        in: query
        description: Flussname (Gross-/Kleinschreibung egal)
        required: false
        schema:
          type: string
        example: Donau
      - name: isActive
        in: query
        description: nur aktive (true) oder inaktive (false) Stationen
        required: false
        schema:
          type: boolean
      - name: warningLevel
        in: query
        description: aktuelle Warnstufe
        required: false
        schema:
          type: string
          enum:
          - NORMAL
          - WARNING
          - CRITICAL
          - UNKNOWN
      responses:
        "200":
          description: Liste der Stationen
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/StationList"
            application/json:
              schema:
                $ref: "#/components/schemas/StationList"
        "406":
          description: Format nicht unterstuetzt
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Ungueltiger Filterwert
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
      - Stationen
      summary: Neue Station anlegen
      description: Die Warnstufe wird serverseitig berechnet und kann nicht mitgeschickt
        werden.
      operationId: createStation
      requestBody:
        content:
          application/xml:
            schema:
              $ref: "#/components/schemas/StationCreateRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/StationCreateRequest"
        required: true
      responses:
        "201":
          description: Station erstellt (Location-Header zeigt auf die neue Ressource)
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Station"
            application/json:
              schema:
                $ref: "#/components/schemas/Station"
        "415":
          description: Medientyp nicht unterstuetzt
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: API-Key ohne Schreibrecht
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Ungueltiger Request-Body
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: API-Key fehlt oder ungueltig
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Station existiert bereits
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - apiKey: []
  /api/v1/stations/{stationId}:
    get:
      tags:
      - Stationen
      summary: Einzelne Station abrufen
      operationId: getStation
      parameters:
      - name: stationId
        in: path
        required: true
        schema:
          type: string
        example: ST-001
      responses:
        "200":
          description: Station gefunden
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Station"
            application/json:
              schema:
                $ref: "#/components/schemas/Station"
        "404":
          description: Station nicht gefunden
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "406":
          description: Format nicht unterstuetzt
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
      - Stationen
      summary: Station inkl. Messwerten loeschen
      operationId: deleteStation
      parameters:
      - name: stationId
        in: path
        required: true
        schema:
          type: string
      responses:
        "404":
          description: Station nicht gefunden
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: API-Key ohne Schreibrecht
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: API-Key fehlt oder ungueltig
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: "Geloescht, keine Antwortdaten"
      security:
      - apiKey: []
    patch:
      tags:
      - Stationen
      summary: Station teilweise aendern (z.B. aktivieren/deaktivieren)
      operationId: updateStation
      parameters:
      - name: stationId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/xml:
            schema:
              $ref: "#/components/schemas/StationUpdateRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/StationUpdateRequest"
        required: true
      responses:
        "404":
          description: Station nicht gefunden
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Medientyp nicht unterstuetzt
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Station geaendert
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Station"
            application/json:
              schema:
                $ref: "#/components/schemas/Station"
        "403":
          description: API-Key ohne Schreibrecht
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Ungueltiger Request-Body
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: API-Key fehlt oder ungueltig
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - apiKey: []
  /api/v1/stations/{stationId}/statistics:
    get:
      tags:
      - Messwerte
      summary: Statistik ueber einen Zeitraum
      description: "Ohne Angabe von from/to: die letzten 24 Stunden."
      operationId: getStatistics
      parameters:
      - name: stationId
        in: path
        required: true
        schema:
          type: string
        example: ST-001
      - name: from
        in: query
        description: Beginn (ISO-8601 mit Zeitzone)
        required: false
        schema:
          type: string
      - name: to
        in: query
        description: Ende (ISO-8601 mit Zeitzone)
        required: false
        schema:
          type: string
      responses:
        "400":
          description: Ungueltiger Zeitraum oder Datumsformat
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Station nicht gefunden
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Statistik
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Statistics"
            application/json:
              schema:
                $ref: "#/components/schemas/Statistics"
  /api/v1/stations/{stationId}/measurements:
    get:
      tags:
      - Messwerte
      summary: Historische Messwerte abrufen
      description: "Neueste zuerst. Zeitraum [from, to] inklusive, maximal 31 Tage."
      operationId: getHistory
      parameters:
      - name: stationId
        in: path
        required: true
        schema:
          type: string
        example: ST-001
      - name: from
        in: query
        description: Beginn (ISO-8601 mit Zeitzone)
        required: false
        schema:
          type: string
        example: 2026-05-01T08:00:00Z
      - name: to
        in: query
        description: Ende (ISO-8601 mit Zeitzone)
        required: false
        schema:
          type: string
        example: 2026-05-01T12:00:00Z
      - name: limit
        in: query
        description: "maximale Anzahl (1-1000, Standard 100)"
        required: false
        schema:
          type: integer
          format: int32
        example: 100
      - name: warningLevel
        in: query
        description: nur Messwerte mit dieser Warnstufe
        required: false
        schema:
          type: string
          enum:
          - NORMAL
          - WARNING
          - CRITICAL
          - UNKNOWN
      responses:
        "404":
          description: Station nicht gefunden
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "406":
          description: Format nicht unterstuetzt
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Messwerte
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/MeasurementList"
            application/json:
              schema:
                $ref: "#/components/schemas/MeasurementList"
        "400":
          description: "Ungueltiger Zeitraum, Datumsformat, Limit oder Warnstufe"
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/stations/{stationId}/measurements/latest:
    get:
      tags:
      - Messwerte
      summary: Aktuellsten Messwert abrufen
      operationId: getLatest
      parameters:
      - name: stationId
        in: path
        required: true
        schema:
          type: string
        example: ST-001
      responses:
        "406":
          description: Format nicht unterstuetzt
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Letzter Messwert
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Measurement"
            application/json:
              schema:
                $ref: "#/components/schemas/Measurement"
        "404":
          description: Station unbekannt oder noch keine Messwerte
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/alerts:
    get:
      tags:
      - Warnungen
      summary: Aktuelle Warnungen abrufen
      description: "Alle aktiven Stationen mit aktueller Warnstufe WARNING oder CRITICAL,\
        \ kritische zuerst."
      operationId: getAlerts
      parameters:
      - name: warningLevel
        in: query
        description: Warnstufe
        required: false
        schema:
          type: string
          enum:
          - WARNING
          - CRITICAL
      - name: river
        in: query
        description: Flussname
        required: false
        schema:
          type: string
        example: Donau
      responses:
        "400":
          description: Ungueltige Warnstufe
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "406":
          description: Format nicht unterstuetzt
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Liste der Warnungen (kann leer sein)
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/AlertList"
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"
components:
  schemas:
    Location:
      type: object
      properties:
        latitude:
          maximum: 90.0
          exclusiveMaximum: false
          minimum: -90.0
          exclusiveMinimum: false
          type: number
          description: Breitengrad
          format: double
          example: 48.4102
        longitude:
          maximum: 180.0
          exclusiveMaximum: false
          minimum: -180.0
          exclusiveMinimum: false
          type: number
          description: Laengengrad
          format: double
          example: 15.6036
      description: Geografische Position (WGS84)
    StationCreateRequest:
      required:
      - criticalWaterLevel
      - id
      - location
      - name
      - normalWaterLevel
      - river
      - warningWaterLevel
      type: object
      properties:
        id:
          pattern: "ST-\\d{3,6}"
          type: string
          example: ST-010
        name:
          maxLength: 80
          minLength: 0
          type: string
          example: Melk
        river:
          maxLength: 80
          minLength: 0
          type: string
          example: Donau
        location:
          $ref: "#/components/schemas/Location"
        normalWaterLevel:
          type: number
          format: double
          example: 260
        warningWaterLevel:
          type: number
          format: double
          example: 350
        criticalWaterLevel:
          type: number
          format: double
          example: 450
        isActive:
          type: boolean
          example: true
          default: true
      description: Neue Messstation
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: 2026-05-01T10:20:00Z
        status:
          type: integer
          format: int32
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: Station ST-999 wurde nicht gefunden
        path:
          type: string
          example: /api/v1/stations/ST-999
      description: Einheitliche Fehlerantwort
    Station:
      type: object
      properties:
        id:
          type: string
          example: ST-001
        name:
          type: string
          example: Krems
        river:
          type: string
          example: Donau
        location:
          $ref: "#/components/schemas/Location"
        normalWaterLevel:
          type: number
          description: Mittlerer Wasserstand in cm
          format: double
          example: 250
        warningWaterLevel:
          type: number
          description: Warnwert in cm
          format: double
          example: 300
        criticalWaterLevel:
          type: number
          description: Kritischer Wert in cm
          format: double
          example: 380
        isActive:
          type: boolean
        status:
          type: string
          enum:
          - ONLINE
          - MAINTENANCE
          - OFFLINE
        currentWarningLevel:
          type: string
          description: Serverseitig berechnete aktuelle Warnstufe (read-only)
          readOnly: true
          enum:
          - NORMAL
          - WARNING
          - CRITICAL
          - UNKNOWN
      description: Messstation
    StationUpdateRequest:
      type: object
      properties:
        name:
          maxLength: 80
          minLength: 1
          type: string
        normalWaterLevel:
          type: number
          format: double
        warningWaterLevel:
          type: number
          format: double
        criticalWaterLevel:
          type: number
          format: double
        isActive:
          type: boolean
          description: Station aktivieren/deaktivieren
          example: false
      description: Teilaenderung einer Station (nur gesetzte Felder werden geaendert)
    StationList:
      type: object
      properties:
        count:
          type: integer
          format: int32
        stations:
          type: array
          items:
            $ref: "#/components/schemas/Station"
      description: Liste von Messstationen
    Statistics:
      type: object
      properties:
        stationId:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        measurementCount:
          type: integer
          format: int32
        minWaterLevel:
          type: number
          description: Niedrigster Wasserstand in cm
          format: double
        maxWaterLevel:
          type: number
          description: Hoechster Wasserstand in cm
          format: double
        averageWaterLevel:
          type: number
          description: Durchschnittlicher Wasserstand in cm
          format: double
        averageFlowRate:
          type: number
          description: Durchschnittliche Durchflussmenge in m3/s
          format: double
        totalRainfall:
          type: number
          description: Summe des Niederschlags (Summe der mm/h-Werte)
          format: double
        warningCount:
          type: integer
          description: Anzahl der Messungen mit Warnstufe WARNING oder CRITICAL
          format: int32
        criticalCount:
          type: integer
          description: Anzahl der Messungen mit Warnstufe CRITICAL
          format: int32
      description: Statistik ueber einen Zeitraum
    Measurement:
      type: object
      properties:
        stationId:
          type: string
          example: ST-001
        timestamp:
          type: string
          description: "Zeitpunkt der Messung (ISO-8601, UTC)"
          format: date-time
          example: 2026-05-01T10:15:00Z
        waterLevel:
          type: number
          description: Wasserstand in cm
          format: double
          example: 318.4
        flowRate:
          type: number
          description: Durchflussmenge in m3/s
          format: double
          example: 742.6
        rainfall:
          type: number
          description: Niederschlag der letzten Stunde in mm/h
          format: double
          example: 12.7
        temperature:
          type: number
          description: Lufttemperatur in Grad Celsius
          format: double
          example: 14.3
        batteryLevel:
          type: integer
          description: Akkustand in Prozent (0-100)
          format: int32
          example: 87
        status:
          type: string
          enum:
          - ONLINE
          - MAINTENANCE
          - OFFLINE
        warningLevel:
          type: string
          description: Serverseitig berechnete Warnstufe
          enum:
          - NORMAL
          - WARNING
          - CRITICAL
          - UNKNOWN
      description: Messwert einer Station
    MeasurementList:
      type: object
      properties:
        stationId:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        count:
          type: integer
          format: int32
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/Measurement"
      description: "Historische Messwerte einer Station, neueste zuerst"
    Alert:
      type: object
      properties:
        stationId:
          type: string
        stationName:
          type: string
        river:
          type: string
        timestamp:
          type: string
          format: date-time
        warningLevel:
          type: string
          enum:
          - NORMAL
          - WARNING
          - CRITICAL
          - UNKNOWN
        waterLevel:
          type: number
          description: Aktueller Wasserstand in cm
          format: double
        thresholdWaterLevel:
          type: number
          description: Ueberschrittener Grenzwert in cm (Warnwert bzw. kritischer
            Wert)
          format: double
        message:
          type: string
      description: Aktuelle Hochwasserwarnung
    AlertList:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        count:
          type: integer
          format: int32
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
      description: Aktuelle Warnungen (WARNING und CRITICAL)
  securitySchemes:
    apiKey:
      type: apiKey
      description: API-Schluessel fuer schreibende Zugriffe
      name: X-API-Key
      in: header
