<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Flood Monitor</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
<h1>Flood Monitor</h1>

<div class="bar">
    Format:
    <label><input type="radio" name="format" value="json" checked> JSON</label>
    <label><input type="radio" name="format" value="xml"> XML</label>
    |
    <label><input type="checkbox" id="autoRefresh" checked> alle 10 Sekunden aktualisieren</label>
    <button id="refresh">Jetzt aktualisieren</button>
    <span id="loading">Lade...</span>
    <span id="lastUpdate"></span>
</div>

<div id="error"></div>
<div id="alerts"></div>

<div class="main">
    <div class="left">
        <h2>Stationen</h2>
        <ul id="stations"></ul>
    </div>

    <div class="right">
        <h2 id="stationName">Aktueller Messwert</h2>
        <div id="current"></div>

        <h2>Historische Messwerte</h2>
        <form id="filter">
            Von <input type="datetime-local" id="from">
            Bis <input type="datetime-local" id="to">
            Warnstufe
            <select id="warningLevel">
                <option value="">alle</option>
                <option>NORMAL</option>
                <option>WARNING</option>
                <option>CRITICAL</option>
                <option>UNKNOWN</option>
            </select>
            Limit <input type="number" id="limit" value="50" min="1" max="1000">
            <button type="submit">Filtern</button>
        </form>

        <table>
            <thead>
            <tr>
                <th>Station</th>
                <th>Zeitpunkt</th>
                <th>Wasserstand (cm)</th>
                <th>Durchfluss (m³/s)</th>
                <th>Niederschlag (mm/h)</th>
                <th>Akku (%)</th>
                <th>Status</th>
                <th>Warnstufe</th>
            </tr>
            </thead>
            <tbody id="history"></tbody>
        </table>
    </div>
</div>

<p class="small"><a href="/swagger-ui.html">API-Doku (Swagger)</a></p>

<script src="js/app.js"></script>
</body>
</html>
