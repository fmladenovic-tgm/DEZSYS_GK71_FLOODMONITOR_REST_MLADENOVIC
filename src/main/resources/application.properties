spring.application.name=floodmonitor
server.port=8080

# --- Simulation -------------------------------------------------------------
# Simulation an/aus (in Tests deaktiviert)
simulation.enabled=true
# Intervall zwischen zwei Messungen pro Station in Millisekunden
simulation.interval=10000
# Beim Start wird eine Historie der letzten N Stunden erzeugt (0 = keine Historie)
simulation.backfill-hours=6
# Abstand der historischen Messungen in Minuten
simulation.backfill-step-minutes=5
# Optionaler Seed fuer reproduzierbare Simulationen (leer = zufaellig)
simulation.seed=

# --- Warnstufen -------------------------------------------------------------
# Messungen, die aelter als dieser Wert (Sekunden) sind, gelten als nicht aktuell -> UNKNOWN
warning.max-measurement-age-seconds=120

# --- API --------------------------------------------------------------------
api.max-limit=1000
api.default-limit=100
api.max-range-days=31
# Maximale Anzahl gespeicherter Messungen pro Station (Speicherschutz)
api.max-history-per-station=20000

# --- Sicherheit -------------------------------------------------------------
# Schreibende Zugriffe (POST/PATCH/DELETE) benoetigen den Header X-API-Key.
# Die Schluessel werden ueber Umgebungsvariablen gesetzt. Die Default-Werte sind
# NUR fuer die lokale Entwicklung gedacht.
security.api-key.admin=${FLOODMONITOR_ADMIN_KEY:dev-admin-key}
security.api-key.reader=${FLOODMONITOR_READER_KEY:dev-reader-key}

# --- Fehlerausgabe: niemals Stacktraces ausliefern ---------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
spring.mvc.problemdetails.enabled=false

# --- Jackson ----------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
# Unbekannte Felder im Request-Body (z.B. warningLevel) -> 400 statt still ignorieren
spring.jackson.deserialization.fail-on-unknown-properties=true

# --- OpenAPI / Swagger UI ---------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json
