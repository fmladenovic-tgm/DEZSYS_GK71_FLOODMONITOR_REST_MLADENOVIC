server.port=8080

# Simulation
simulation.enabled=true
simulation.interval=10000
simulation.history-hours=6
# fester Seed = immer gleiche Werte (leer = zufaellig)
simulation.seed=

# API-Keys (in echt ueber Umgebungsvariablen setzen!)
security.api-key.admin=${FLOODMONITOR_ADMIN_KEY:dev-admin-key}
security.api-key.reader=${FLOODMONITOR_READER_KEY:dev-reader-key}

# keine Stacktraces an den Client
server.error.include-stacktrace=never

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=true
